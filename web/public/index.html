<!doctype html>
<html lang="vi" data-title="Quản lý Tài chính Nhà Mình">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quản lý Tài chính Nhà Mình</title>
<meta name="description" content="Quản lý tài chính gia đình: tài sản ròng, chi tiêu, quỹ khẩn cấp, sổ tiết kiệm và quỹ cho con.">
<meta name="theme-color" content="#1B5C41">
<script src="/js/theme.js?v=15"></script>
<script src="/js/i18n-dict.js?v=10"></script>
<script src="/js/i18n.js?v=2"></script>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/icon.svg?v=2" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tài Chính">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400;1,500&display=swap">
<link rel="stylesheet" href="/css/app.css?v=31">
<script src="/js/client.js?v=16" defer></script>
<script src="/js/fund-catalog.js?v=2" defer></script>
<script src="/js/app.js?v=34" defer></script>
</head>
<body>
<a class="skip" href="#main" data-i18n>Bỏ qua điều hướng</a>
<div class="app">
  <aside class="rail" aria-label="Điều hướng chính" data-i18n-attr="aria-label">
    <div class="brand"><img class="brand-mark" src="/icon.svg?v=2" alt="" width="40" height="40"><div><b data-i18n>Quản lý Tài chính</b><span><span data-i18n>Nhà mình</span> · <span id="brandYear"></span></span></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="rail-foot">
      <div class="sync" role="status"><span class="dot" id="syncDot"></span><span id="syncText">Đang kết nối…</span></div>
      <div class="me" id="meBox"></div>
    </div>
  </aside>
  <div class="main-wrap">
    <header class="top">
      <div class="top-title"><p class="greeting" id="greeting" aria-live="polite"></p><div class="eyebrow" id="pageEyebrow">Tổng quan</div><h1 id="pageTitle">Tài chính Gia đình</h1></div>
      <button class="icon-btn logout-top" type="button" id="logoutTop" aria-label="Đăng xuất" title="Đăng xuất" data-i18n-attr="aria-label,title"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H4"/></svg></button>
      <div class="top-actions">
        <label class="lang-sel" for="langSel"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg><b class="lang-code" id="langCode" aria-hidden="true">VI</b><span class="sr-only" data-i18n>Ngôn ngữ</span><select id="langSel" aria-label="Ngôn ngữ" data-i18n-attr="aria-label"><option value="vi" lang="vi">VI · Tiếng Việt</option><option value="en" lang="en">EN · English</option><option value="ja" lang="ja">JA · 日本語</option></select></label>
        <button class="icon-btn bell-btn" type="button" id="bellBtn" aria-haspopup="dialog" aria-expanded="false" aria-label="Thông báo" title="Thông báo" data-i18n-attr="aria-label,title"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg><span class="bell-badge" id="bellBadge" hidden></span></button>
        <button class="icon-btn privacy-btn" type="button" id="privacyBtn" aria-pressed="false"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
        <button class="icon-btn theme-btn" type="button" id="themeBtn" aria-label="Đổi giao diện sáng / tối" title="Đổi giao diện sáng / tối"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg></button>
        <label class="year-pick" for="yearSel"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span class="sr-only" data-i18n>Năm làm việc</span><select id="yearSel" aria-label="Chọn năm" data-i18n-attr="aria-label"></select></label>
        <button class="btn primary" id="addBtn" type="button"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span data-i18n>Ghi chép</span></button>
      </div>
    </header>
    <main id="main" tabindex="-1"></main>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="Điều hướng chính" data-i18n-attr="aria-label"></nav>
  <button class="fab" id="fab" type="button"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span data-i18n>Ghi chép</span></button>
</div>
<div id="sheet" hidden><div class="scrim" data-close></div><div class="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle" id="panel"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
