<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6DB4F0"/><stop offset="1" stop-color="#2F7FD0"/></linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFF8EE"/><stop offset="1" stop-color="#E9DCC8"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A9D6F7"/><stop offset="1" stop-color="#5C9FD8"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C79A3E"/><stop offset=".45" stop-color="#F2D27A"/><stop offset="1" stop-color="#B8862F"/></linearGradient>
    <radialGradient id="coin" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="#FFD58A"/><stop offset=".6" stop-color="#F7A440"/><stop offset="1" stop-color="#E07A1F"/></radialGradient>
  </defs>
  <ellipse cx="33" cy="60" rx="27" ry="2.6" fill="#0F3A28" opacity=".18"/>
  <!-- house -->
  <rect x="38" y="9" width="7" height="12" rx="1.5" fill="url(#roof)"/>
  <rect x="12" y="27" width="34" height="29" rx="2" fill="url(#wall)"/>
  <path d="M7.5 30.5 L29 11.5 L50.5 30.5" fill="none" stroke="#2468B0" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M7.5 29 L29 10 L50.5 29" fill="none" stroke="url(#roof)" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M22 56 V42 a7 7 0 0 1 14 0 V56 Z" fill="#C8693F"/>
  <path d="M24.2 56 V42.4 a4.8 4.8 0 0 1 9.6 0 V56 Z" fill="url(#glass)"/>
  <path d="M29 37.6 V56 M24.2 45.5 H33.8 M24.2 50.5 H33.8" stroke="#FFFFFF" stroke-width="1.3"/>
  <!-- coin stack -->
  <g>
    <rect x="3" y="51" width="19" height="5" rx="2.5" fill="url(#gold)"/>
    <rect x="3" y="46" width="19" height="5" rx="2.5" fill="url(#gold)"/>
    <rect x="3" y="41" width="19" height="5" rx="2.5" fill="url(#gold)"/>
    <rect x="3" y="36" width="19" height="5" rx="2.5" fill="url(#gold)"/>
    <path d="M4 41 H21 M4 46 H21 M4 51 H21" stroke="#9A7226" stroke-width=".8" opacity=".55"/>
  </g>
  <!-- big coin -->
  <circle cx="47" cy="45" r="14" fill="#C9661A"/>
  <circle cx="46" cy="44" r="14" fill="url(#coin)"/>
  <circle cx="46" cy="44" r="10.2" fill="none" stroke="#E8851F" stroke-width="1.6"/>
  <text x="46" y="50.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#FFF4DC">₫</text>
